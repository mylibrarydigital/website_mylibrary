name: Deploy Website...

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Display version info
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Deploying version: $CURRENT_VERSION"

      - name: Install Dependencies
        run: npm install

      - name: Build Website
        run: npm run build

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Website Docker Image
        run: |
          docker build -t mylibrary-website-live:${{ github.sha }} .
          docker tag mylibrary-website-live:${{ github.sha }} mylibrary-website-live:latest

      - name: Save Docker Image
        run: docker save mylibrary-website-live:latest | gzip > mylibrary-website-live.tar.gz

      - name: Copy Docker Image to Lightsail
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_LIVE_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_LIVE_SSH_KEY }}
          source: mylibrary-website-live.tar.gz
          target: /tmp/

      - name: Deploy on Lightsail
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.LIGHTSAIL_LIVE_IP }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_LIVE_SSH_KEY }}
          script: |
            set -e
            
            # Verify file was copied successfully
            if [ ! -f /tmp/mylibrary-website-live.tar.gz ]; then
              echo "Error: File /tmp/mylibrary-website-live.tar.gz not found!"
              exit 1
            fi
            
            # Ensure target directory exists and has correct permissions
            sudo mkdir -p /opt/mylibrary/mylibrary.lk
            sudo chown ubuntu:ubuntu /opt/mylibrary/mylibrary.lk
            
            # Move file from /tmp to target directory with proper permissions
            sudo mv /tmp/mylibrary-website-live.tar.gz /opt/mylibrary/mylibrary.lk/
            sudo chown ubuntu:ubuntu /opt/mylibrary/mylibrary.lk/mylibrary-website-live.tar.gz
            
            cd /opt/mylibrary/mylibrary.lk
            
            # Verify file is accessible
            if [ ! -f mylibrary-website-live.tar.gz ]; then
              echo "Error: File not found in target directory!"
              exit 1
            fi

            # Load and run container
            docker load < mylibrary-website-live.tar.gz
            docker stop mylibrary-website-live || true
            docker rm mylibrary-website-live || true

            # Run container
            docker run -d \
              --name mylibrary-website-live \
              --restart unless-stopped \
              -p 3001:80 \
              --network mylibrary-network \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --health-cmd "wget --no-verbose --tries=1 --spider http://localhost/health || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              --health-start-period=10s \
              mylibrary-website-live:latest

            # Cleanup - remove loaded tar.gz file to save disk space
            rm -f mylibrary-website-live.tar.gz
            
            # Cleanup unused Docker images
            docker image prune -f

            # Restart services
            sudo systemctl restart nginx || true
